name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          find . -maxdepth 4 -type f | sort
          test -f settings.gradle.kts || (echo 'ERROR: settings.gradle.kts missing from root'; exit 1)
          test -f app/build.gradle.kts || (echo 'ERROR: app/build.gradle.kts missing; app folder must be at root'; exit 1)
          test -f app/src/main/AndroidManifest.xml || (echo 'ERROR: AndroidManifest.xml missing'; exit 1)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: List Gradle tasks
        run: gradle tasks --all

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soul-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
